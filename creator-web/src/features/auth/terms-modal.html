  <div id="terms-consent-modal"
    class="hidden fixed inset-0 z-[10000] items-center justify-center bg-neutral-950/55 p-4 backdrop-blur-[2px]"
    role="dialog" aria-modal="true" aria-labelledby="terms-consent-title"
    aria-describedby="terms-consent-description">
    <div class="flex max-h-[92vh] w-full max-w-[560px] flex-col overflow-hidden rounded-[24px] border border-white/70 bg-[#FBFBF7] shadow-2xl">
      <div class="border-b border-neutral-200 bg-white px-6 py-5 sm:px-7">
        <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-2xl bg-[#EEF7DE] text-2xl"
          aria-hidden="true">📋</div>
        <h2 id="terms-consent-title" class="text-xl font-extrabold tracking-tight text-neutral-dark">
          서비스 이용을 위해 약관을 확인해 주세요
        </h2>
        <p id="terms-consent-description" class="mt-1.5 text-xs font-medium leading-5 text-neutral-500">
          필수 약관에 동의해야 서비스를 계속 이용할 수 있어요. 선택 동의는 언제든 변경할 수 있습니다.
        </p>
      </div>

      <div class="flex-1 overflow-y-auto px-6 py-5 sm:px-7">
        <label id="terms-consent-all-wrapper"
          class="mb-3 flex cursor-pointer items-center gap-3 rounded-xl border border-[#CFE5A8] bg-[#F5FBEA] px-4 py-3.5">
          <input id="terms-consent-all" type="checkbox"
            class="h-4 w-4 shrink-0 cursor-pointer accent-[#2F6517]" />
          <span>
            <span class="block text-sm font-extrabold text-neutral-800">전체 동의</span>
            <span class="mt-0.5 block text-[11px] font-medium text-neutral-500">필수 및 선택 약관을 모두 선택합니다.</span>
          </span>
        </label>

        <div id="terms-consent-document-list" class="space-y-2"></div>

        <div id="terms-document-detail"
          class="hidden mt-4 rounded-2xl border border-neutral-200 bg-white p-4">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h3 id="terms-document-detail-title" class="text-sm font-extrabold text-neutral-800"></h3>
            <button id="btn-terms-document-detail-close" type="button"
              class="shrink-0 rounded-lg px-2 py-1 text-[11px] font-bold text-neutral-500 hover:bg-neutral-100">
              닫기
            </button>
          </div>
          <pre id="terms-document-detail-content"
            class="max-h-64 overflow-y-auto whitespace-pre-wrap break-words font-sans text-[11px] leading-5 text-neutral-600"></pre>
        </div>

        <p id="terms-consent-error" role="alert" aria-live="assertive"
          class="hidden mt-4 rounded-xl bg-red-50 px-4 py-3 text-xs font-bold text-red-600"></p>
        <button id="btn-terms-consent-retry" type="button"
          class="hidden mt-3 w-full rounded-xl border border-neutral-300 bg-white px-4 py-3 text-xs font-extrabold text-neutral-700 hover:bg-neutral-50">
          약관 다시 불러오기
        </button>
      </div>

      <div class="grid grid-cols-1 gap-2 border-t border-neutral-200 bg-white px-6 py-4 sm:grid-cols-[1fr_2fr] sm:px-7">
        <button id="btn-terms-consent-decline" type="button"
          class="rounded-xl border border-neutral-300 bg-white px-4 py-3 text-xs font-bold text-neutral-500 hover:bg-neutral-50">
          동의하지 않고 로그아웃
        </button>
        <button id="btn-terms-consent-confirm" type="button" disabled
          class="rounded-xl border border-[#2F6517]/20 bg-primary px-4 py-3 text-sm font-extrabold text-neutral-dark shadow-sm transition-all hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-40">
          동의하고 계속하기
        </button>
      </div>
    </div>
  </div>
