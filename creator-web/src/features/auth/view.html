  <!-- ========================================================
       VIEW: LOGIN PAGE (Supabase 이메일 인증)
  ======================================================== -->
  <div id="view-login" class="view-container hidden w-full min-h-screen flex flex-col bg-[#FBFBF7]">
    <header class="w-full border-b border-neutral-lightborder sticky top-0 z-30 bg-white/95 backdrop-blur-sm">
      <div class="max-w-[1360px] mx-auto px-8 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('landing')">
          <img src="/images/brand/logo-default.png" alt="돈 돼?" class="h-9 w-auto object-contain" />
          <span class="text-xl font-extrabold text-[#2F6517] tracking-tight">돈 돼?</span>
        </div>
        <button onclick="navigateTo('landing')"
          class="text-xs font-semibold text-neutral-500 hover:text-neutral-800 transition-colors">
          ← 랜딩 페이지로 돌아가기
        </button>
      </div>
    </header>

    <main class="flex-1 w-full flex items-center justify-center p-6 sm:p-12">
      <div
        class="w-full max-w-[440px] bg-white rounded-[24px] border border-[#EBEBEB] shadow-card p-8 sm:p-10 flex flex-col items-center animate-in fade-in zoom-in-95 duration-200">
        <!-- Header Logo & Title -->
        <div
          class="w-16 h-16 rounded-2xl bg-canvas-cream border border-[#E9E4C2] flex items-center justify-center p-2 mb-4 shadow-xs">
          <img src="/images/brand/logo-default.png" alt="로고" class="w-full h-full object-contain" />
        </div>
        <h2 id="auth-title" class="text-2xl font-extrabold text-neutral-dark mb-1 tracking-tight text-center">
          돈 돼? 로그인
        </h2>
        <p id="auth-description" class="text-xs text-neutral-muted mb-8 text-center">
          가입한 이메일과 비밀번호를 입력해 주세요.
        </p>

        <div id="auth-error-msg" role="alert" aria-live="assertive"
          class="w-full text-xs font-bold text-red-500 hidden text-center mb-4"></div>
        <div id="auth-success-msg" role="status" aria-live="polite"
          class="w-full text-xs font-bold text-[#2F6517] hidden text-center mb-4"></div>

        <div id="auth-form-panel" class="w-full">
          <div id="auth-mode-tabs" class="w-full grid grid-cols-2 gap-1 bg-neutral-100 rounded-xl p-1 mb-6"
            role="tablist" aria-label="인증 방식 선택">
            <button type="button" id="auth-mode-login" role="tab" aria-selected="true" aria-controls="auth-form"
              class="py-2.5 rounded-lg bg-white text-neutral-dark text-xs font-extrabold shadow-sm transition-all">
              로그인
            </button>
            <button type="button" id="auth-mode-signup" role="tab" aria-selected="false" aria-controls="auth-form"
              class="py-2.5 rounded-lg text-neutral-500 text-xs font-bold transition-all">
              회원가입
            </button>
          </div>

          <!-- Supabase Email Auth Form -->
          <form id="auth-form" class="w-full flex flex-col gap-4" novalidate>
            <div>
              <label for="auth-email-input" class="block text-xs font-bold text-neutral-dark mb-1.5">이메일</label>
              <input id="auth-email-input" type="email" inputmode="email" autocomplete="email" autocapitalize="none"
                spellcheck="false" placeholder="이메일을 입력하세요"
                class="w-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/60 transition-all text-sm font-medium ui-input"
                required />
            </div>

            <div id="auth-password-group">
              <label for="auth-password-input" class="block text-xs font-bold text-neutral-dark mb-1.5">비밀번호</label>
              <div class="relative">
                <input id="auth-password-input" type="password" autocomplete="current-password" minlength="6"
                  placeholder="비밀번호를 입력하세요"
                  class="w-full px-4 py-3 pr-16 focus:outline-none focus:ring-2 focus:ring-primary/60 transition-all text-sm font-medium ui-input"
                  required />
                <button type="button" data-password-toggle data-password-target="auth-password-input"
                  class="absolute inset-y-0 right-3 text-[11px] font-bold text-neutral-400 hover:text-neutral-dark transition-colors"
                  aria-label="비밀번호 표시" aria-pressed="false">보기</button>
              </div>
              <p id="auth-password-hint" class="hidden mt-1.5 text-[11px] font-medium text-neutral-400">
                비밀번호는 6자 이상 입력해 주세요.
              </p>
              <button type="button" id="btn-auth-forgot-password"
                class="mt-2 text-[11px] font-bold text-[#568A32] hover:text-[#2F6517] transition-colors">
                비밀번호를 잊으셨나요?
              </button>
            </div>

            <div id="auth-password-confirm-group" class="hidden">
              <label for="auth-password-confirm-input" class="block text-xs font-bold text-neutral-dark mb-1.5">비밀번호
                확인</label>
              <div class="relative">
                <input id="auth-password-confirm-input" type="password" autocomplete="new-password" minlength="6"
                  placeholder="비밀번호를 한 번 더 입력하세요"
                  class="w-full px-4 py-3 pr-16 focus:outline-none focus:ring-2 focus:ring-primary/60 transition-all text-sm font-medium ui-input"
                  disabled />
                <button type="button" data-password-toggle data-password-target="auth-password-confirm-input"
                  class="absolute inset-y-0 right-3 text-[11px] font-bold text-neutral-400 hover:text-neutral-dark transition-colors"
                  aria-label="비밀번호 확인 표시" aria-pressed="false">보기</button>
              </div>
            </div>

            <button type="submit" id="btn-auth-submit"
              class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary-hover active:scale-98 text-neutral-dark font-extrabold text-sm shadow-sm transition-all flex items-center justify-center gap-2 border border-primary-dark/20 cursor-pointer disabled:cursor-wait disabled:opacity-80 mt-1"
              aria-busy="false">
              <span id="btn-auth-submit-spinner"
                class="hidden h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-neutral-dark/25 border-t-neutral-dark"
                aria-hidden="true"></span>
              <span id="btn-auth-submit-text">로그인하기</span>
              <span id="btn-auth-submit-arrow" aria-hidden="true">→</span>
            </button>

            <p id="auth-loading-status" role="status" aria-live="polite"
              class="hidden text-center text-[11px] font-semibold text-neutral-500">
              계정과 이용 상태를 확인하고 있습니다. 잠시만 기다려 주세요.
            </p>

            <button type="button" id="btn-auth-recovery-back"
              class="hidden w-full py-3 px-4 rounded-xl bg-white hover:bg-neutral-50 active:scale-98 text-neutral-600 font-bold text-sm transition-all border border-neutral-300 cursor-pointer">
              로그인으로 돌아가기
            </button>
          </form>

          <!-- 소셜 로그인: 확인 메일 없이 바로 가입/로그인되는 경로 -->
          <div id="auth-social-panel" class="w-full">
            <div class="flex items-center gap-3 my-5" aria-hidden="true">
              <span class="h-px flex-1 bg-neutral-200"></span>
              <span class="text-[11px] font-bold text-neutral-400">또는</span>
              <span class="h-px flex-1 bg-neutral-200"></span>
            </div>

            <button type="button" id="btn-auth-google"
              class="w-full flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl border border-neutral-200 bg-white text-sm font-bold text-neutral-dark shadow-2xs transition-all hover:bg-neutral-50 hover:border-neutral-300 disabled:opacity-60 disabled:cursor-not-allowed">
              <svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <path fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.55 10.78l7.98-6.19z" />
                <path fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
              </svg>
              <span>구글 계정으로 계속하기</span>
            </button>
          </div>

        </div>

        <div id="auth-confirmation-panel" class="hidden w-full text-center">
          <div class="mx-auto w-16 h-16 rounded-full bg-[#EEF7DE] flex items-center justify-center text-3xl mb-5"
            aria-hidden="true">✉️</div>
          <p id="auth-email-sent-title" class="text-sm font-extrabold text-neutral-dark mb-2">회원가입 확인 메일을 확인해 주세요</p>
          <p id="auth-email-sent-description" class="text-xs leading-5 text-neutral-muted mb-5">
            <strong id="auth-confirmation-email" class="text-neutral-dark"></strong><br />
            <span id="auth-email-sent-message">메일의 회원가입 확인 버튼을 눌러 주세요.<br />메일이 없다면 스팸함도 확인해 주세요.</span>
          </p>
          <button type="button" id="btn-auth-confirmation-complete"
            class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary-hover active:scale-98 text-neutral-dark font-extrabold text-sm shadow-sm transition-all border border-primary-dark/20 cursor-pointer">
            인증 완료했어요
          </button>
          <button type="button" id="btn-auth-continue-current-tab"
            class="hidden w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary-hover active:scale-98 text-neutral-dark font-extrabold text-sm shadow-sm transition-all border border-primary-dark/20 cursor-pointer">
            이 탭에서 계속하기
          </button>
          <button type="button" id="btn-auth-resend"
            class="w-full mt-3 py-3 px-4 rounded-xl bg-white hover:bg-neutral-50 active:scale-98 text-neutral-600 font-bold text-sm transition-all border border-neutral-300 cursor-pointer">
            확인 메일 다시 보내기
          </button>
          <button type="button" id="btn-auth-back-to-login"
            class="w-full mt-3 py-3 px-4 rounded-xl bg-white hover:bg-neutral-50 active:scale-98 text-neutral-600 font-bold text-sm transition-all border border-neutral-300 cursor-pointer">
            로그인으로 돌아가기
          </button>
        </div>

        <form id="auth-password-update-panel" class="hidden w-full flex-col gap-4" novalidate>
          <div>
            <label for="auth-new-password-input" class="block text-xs font-bold text-neutral-dark mb-1.5">새 비밀번호</label>
            <div class="relative">
              <input id="auth-new-password-input" type="password" autocomplete="new-password" minlength="6"
                placeholder="새 비밀번호를 입력하세요"
                class="w-full px-4 py-3 pr-16 focus:outline-none focus:ring-2 focus:ring-primary/60 transition-all text-sm font-medium ui-input"
                required />
              <button type="button" data-password-toggle data-password-target="auth-new-password-input"
                class="absolute inset-y-0 right-3 text-[11px] font-bold text-neutral-400 hover:text-neutral-dark transition-colors"
                aria-label="새 비밀번호 표시" aria-pressed="false">보기</button>
            </div>
            <p class="mt-1.5 text-[11px] font-medium text-neutral-400">비밀번호는 6자 이상 입력해 주세요.</p>
          </div>

          <div>
            <label for="auth-new-password-confirm-input" class="block text-xs font-bold text-neutral-dark mb-1.5">새 비밀번호
              확인</label>
            <div class="relative">
              <input id="auth-new-password-confirm-input" type="password" autocomplete="new-password" minlength="6"
                placeholder="새 비밀번호를 한 번 더 입력하세요"
                class="w-full px-4 py-3 pr-16 focus:outline-none focus:ring-2 focus:ring-primary/60 transition-all text-sm font-medium ui-input"
                required />
              <button type="button" data-password-toggle data-password-target="auth-new-password-confirm-input"
                class="absolute inset-y-0 right-3 text-[11px] font-bold text-neutral-400 hover:text-neutral-dark transition-colors"
                aria-label="새 비밀번호 확인 표시" aria-pressed="false">보기</button>
            </div>
          </div>

          <button type="submit" id="btn-auth-password-update"
            class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary-hover active:scale-98 text-neutral-dark font-extrabold text-sm shadow-sm transition-all border border-primary-dark/20 cursor-pointer mt-1">
            새 비밀번호 저장하기
          </button>
        </form>
      </div>
    </main>
  </div>
