  <!-- ==========================================================
       VIEW 6: INTERNAL VOTE / MISSION PROGRESS
  ========================================================== -->
  <div id="view-vote-progress" class="view-container hidden w-full min-h-screen flex flex-col bg-[#F8FAF3]">
    <header class="sticky top-0 z-20 border-b border-[#E4EBD3] bg-white/95 backdrop-blur-sm">
      <div class="mx-auto flex h-16 w-full max-w-[1180px] items-center justify-between px-5 sm:px-8">
        <button type="button" onclick="cancelInternalTestFlow()"
          class="flex items-center gap-2 text-xs font-bold text-neutral-600 transition-colors hover:text-neutral-dark">
          <span aria-hidden="true">←</span>
          <span>테스트 상세로</span>
        </button>
        <button type="button" onclick="navigateTo('explore')" class="flex items-center gap-2.5">
          <img src="/images/brand/logo-default.png" alt="돈 돼?" class="h-8 w-auto object-contain" />
          <span class="text-base font-extrabold text-[#2F6517]">돈 돼?</span>
        </button>
        <span id="part-internal-reward"
          class="rounded-full border border-purple-200 bg-purple-50 px-3 py-1.5 text-xs font-extrabold text-[#7E22CE]">
          +0 돼지코인
        </span>
      </div>
    </header>

    <main class="mx-auto grid w-full max-w-[1180px] flex-1 grid-cols-1 gap-6 px-5 py-8 sm:px-8 lg:grid-cols-[260px_minmax(0,1fr)] lg:py-10">
      <aside class="h-fit rounded-[22px] border border-[#DFE8CB] bg-white p-5 shadow-subtle lg:sticky lg:top-24">
        <span id="vote-progress-badge" class="inline-flex items-center gap-1.5 rounded-full bg-[#2F6517] px-3 py-1 text-[11px] font-extrabold text-white">
          <span aria-hidden="true">🗳️</span> 내부 미션 진행
        </span>
        <h2 id="vote-progress-heading" class="mt-4 text-lg font-extrabold tracking-tight text-neutral-dark">시안을 비교해 주세요</h2>
        <p id="vote-progress-description" class="mt-2 text-xs font-medium leading-5 text-neutral-500">
          각 시안을 충분히 확인한 뒤 더 마음에 드는 안을 선택해 주세요.
        </p>

        <ol class="mt-5 space-y-3 border-t border-neutral-100 pt-5 text-xs">
          <li class="flex items-start gap-3">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#2F6517] text-[10px] font-extrabold text-white">1</span>
            <span class="pt-1 font-bold text-neutral-800">시안과 진행 안내 확인</span>
          </li>
          <li class="flex items-start gap-3">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-primary/40 text-[10px] font-extrabold text-[#2F6517]">2</span>
            <span id="vote-progress-step-two" class="pt-1 font-bold text-neutral-800">선호 시안 선택</span>
          </li>
          <li class="flex items-start gap-3">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-neutral-100 text-[10px] font-extrabold text-neutral-500">3</span>
            <span id="vote-progress-step-three" class="pt-1 font-bold text-neutral-600">투표 완료 후 리워드 수령</span>
          </li>
        </ol>

        <div id="vote-progress-aside-notice" class="mt-5 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3 text-[11px] font-medium leading-5 text-amber-900">
          시안 투표를 완료하면 돼지코인 리워드가 즉시 지급됩니다.
        </div>
      </aside>

      <section class="min-w-0 rounded-[24px] border border-neutral-200 bg-white p-5 shadow-card sm:p-7 lg:p-8">
        <div class="mb-6 border-b border-neutral-100 pb-5">
          <div class="mb-2 flex flex-wrap items-center gap-2">
            <span id="vote-progress-view-label" class="rounded-full bg-primary/25 px-2.5 py-1 text-[11px] font-extrabold text-[#2F6517]">시안 투표 진행</span>
            <span class="text-[11px] font-bold text-neutral-400">선택 내용은 리뷰와 함께 안전하게 저장됩니다.</span>
          </div>
          <h1 id="part-internal-title" class="text-xl font-extrabold tracking-tight text-neutral-dark sm:text-2xl">
            투표 정보를 불러오는 중입니다
          </h1>
        </div>

        <div id="part-internal-dynamic-content" class="flex flex-col gap-5" aria-live="polite">
          <div class="rounded-2xl border border-neutral-200 bg-neutral-50 p-10 text-center text-xs font-bold text-neutral-500">
            등록된 시안과 질문을 불러오고 있습니다...
          </div>
        </div>

        <div class="mt-7 flex flex-col-reverse gap-3 border-t border-neutral-100 pt-6 sm:flex-row sm:justify-between">
          <button type="button" onclick="cancelInternalTestFlow()"
            class="rounded-xl border border-neutral-300 bg-white px-5 py-3 text-xs font-bold text-neutral-600 transition-colors hover:bg-neutral-50">
            나중에 참여하기
          </button>
          <button type="button" id="btn-complete-internal-test" onclick="completeInternalTestFlow()"
            class="rounded-xl bg-[#2F6517] px-6 py-3.5 text-sm font-extrabold text-white shadow-sm transition-all hover:bg-[#25500F] active:scale-98">
            <span id="btn-complete-internal-test-text">선택 완료하고 리뷰 작성하기 →</span>
          </button>
        </div>
      </section>
    </main>
  </div>
