<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>돈 돼? 회원가입 이메일 확인</title>
  </head>
  <body style="margin:0;background:#fbfbf7;font-family:Arial,'Noto Sans KR',sans-serif;color:#252525;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#fbfbf7;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
            style="max-width:480px;padding:32px;border:1px solid #ebebeb;border-radius:20px;background:#ffffff;">
            <tr>
              <td>
                <p style="margin:0 0 10px;color:#2f6517;font-size:14px;font-weight:700;">돈 돼?</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.4;">이메일 주소를 확인해 주세요</h1>
                <p style="margin:0;color:#666666;font-size:14px;line-height:1.7;">
                  회원가입을 계속하려면 아래 버튼을 눌러 이메일 주소를 확인해 주세요.
                </p>
                <p style="margin:28px 0;text-align:center;">
                  <a href="{{ .ConfirmationURL }}"
                    style="display:inline-block;padding:14px 28px;border-radius:12px;background:#b8e986;color:#244d12;font-size:15px;font-weight:800;text-decoration:none;">
                    회원가입 확인하기
                  </a>
                </p>
                <p style="margin:0;color:#888888;font-size:12px;line-height:1.7;">
                  본인이 요청하지 않았다면 이 메일을 무시해 주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
